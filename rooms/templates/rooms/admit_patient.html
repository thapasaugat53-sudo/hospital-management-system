{% extends "base.html" %}

{% block title %}Admit Patient{% endblock %}

{% block content %}

<h1>Admit Patient</h1>

<div class="card" style="max-width: 700px; margin: 0 auto;">

    <h2>Admission Details</h2>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn">
            Admit Patient
        </button>

    </form>

</div>

<div style="margin-top: 20px;">

    <a href="{% url 'bed_list' %}" class="btn">
        View Beds
    </a>

    <a href="{% url 'room_list' %}" class="btn" style="margin-left: 8px;">
        View Rooms
    </a>

</div>

{% endblock %}
