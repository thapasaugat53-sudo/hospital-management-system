{% extends "base.html" %}

{% block title %}Doctors{% endblock %}

{% block content %}

<h1>Doctors</h1>

<table>

    <thead>
        <tr>
            <th>Name</th>
            <th>Department</th>
            <th>Specialization</th>
        </tr>
    </thead>

    <tbody>

        {% for doctor in doctors %}
        <tr>
            <td>{{ doctor }}</td>
            <td>{{ doctor.department }}</td>
            <td>{{ doctor.specialization }}</td>
        </tr>

        {% empty %}
        <tr>
            <td colspan="3">No doctors found.</td>
        </tr>
        {% endfor %}

    </tbody>

</table>

{% endblock %}
