{% extends "base.html" %}

{% block title %}Edit Medicine{% endblock %}

{% block content %}

<h1>Edit Medicine</h1>

<div class="card" style="max-width: 700px; margin: 0 auto;">

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn">
            Update Medicine
        </button>

    </form>

</div>

<div style="margin-top: 20px;">

    <a href="{% url 'medicine_list' %}" class="btn">
        Back to Medicine List
    </a>

</div>

{% endblock %}
