{% extends "base.html" %}

{% block title %}{{ action }} Stock{% endblock %}

{% block content %}

<h1>{{ action }} Stock</h1>

<div class="card" style="max-width: 700px; margin: 0 auto;">

    <h2>{{ medicine.name }}</h2>

    <p>
        <strong>Current Stock:</strong>
        {{ medicine.quantity }}
    </p>

</div>

<div class="card" style="max-width: 700px; margin: 25px auto 0;">

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn">
            {{ action }} Stock
        </button>

    </form>

</div>

<div style="max-width: 700px; margin: 20px auto;">

    <a href="{% url 'medicine_list' %}" class="btn">
        Back to Medicine List
    </a>

</div>

{% endblock %}
